<!DOCTYPE html>
<html>
<body>
<script>
  window['ai_edge_gallery_get_result'] = async (data) => {
    try {
      const city = JSON.parse(data).city;

      // 1. Get coordinates using Open-Meteo Geocoding (No key needed!)
      const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
      const geoRes = await fetch(geoUrl);
      const geoData = await geoRes.json();

      if (!geoData.results || geoData.results.length === 0) {
        return JSON.stringify({ error: `Could not find a city named "${city}".` });
      }

      const { latitude, longitude, name, country } = geoData.results[0];

      // 2. Get current weather data
      const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code&wind_speed_unit=ms`;
      const weatherRes = await fetch(weatherUrl);
      const weatherData = await weatherRes.json();

      const temp = weatherData.current.temperature_2m;
      const humidity = weatherData.current.relative_humidity_2m;
      
      // Simple weather code mapping (optional expansion)
      const resultText = `The current weather in ${name}, ${country} is ${temp}°C with ${humidity}% humidity.`;

      return JSON.stringify({ 
        result: resultText 
      });

    } catch (e) {
      return JSON.stringify({ error: `Skill Error: ${e.message}` });
    }
  };
</script>
</body>
</html>
