<!DOCTYPE html>
<html>
<body>
<script>
  window['ai_edge_gallery_get_result'] = async (data) => {
    try {
      const args = JSON.parse(data);
      const { action, path, content, newPath, quotaMB } = args;
      const root = await navigator.storage.getDirectory();
      const QUOTA_KEY = "stew_fs_quota_mb";

      // Improved Path Helper
      const getFileHandle = async (filePath, create = false) => {
        const parts = filePath.split('/').filter(p => p);
        let currentDir = root;
        for (let i = 0; i < parts.length - 1; i++) {
          currentDir = await currentDir.getDirectoryHandle(parts[i], { create });
        }
        return await currentDir.getFileHandle(parts[parts.length - 1], { create });
      };

      // 1. Config (The likely failure point)
      if (action === "config") {
        if (typeof quotaMB !== 'number') throw new Error("quotaMB must be a number");
        localStorage.setItem(QUOTA_KEY, quotaMB.toString());
        return JSON.stringify({ result: `Success: Virtual Drive size set to ${quotaMB}MB.` });
      }

      // 2. Drive Status & Listing
      if (action === "status" || action === "list") {
        const estimate = await navigator.storage.estimate();
        const usageMB = (estimate.usage / (1024 * 1024)).toFixed(2);
        const limit = localStorage.getItem(QUOTA_KEY) || "Unlimited";
        
        let entries = [];
        for await (const entry of root.values()) {
          let extra = entry.kind === 'directory' ? '[DIR]' : '[FILE]';
          entries.push(`${extra} ${entry.name}`);
        }
        
        const info = `Drive: ${usageMB}MB / ${limit}MB used.\n\nItems:\n${entries.join("\n") || "Empty"}`;
        return JSON.stringify({ result: info });
      }

      // 3. Robust Write/Append
      if (action === "write" || action === "append") {
        const limit = parseFloat(localStorage.getItem(QUOTA_KEY));
        if (limit) {
          const est = await navigator.storage.estimate();
          if ((est.usage / (1024 * 1024)) >= limit) {
            return JSON.stringify({ result: "FAILED: Drive is full." });
          }
        }
        const handle = await getFileHandle(path, true);
        const writable = await handle.createWritable({ keepExistingData: (action === "append") });
        if (action === "append") {
          const file = await handle.getFile();
          await writable.seek(file.size);
        }
        await writable.write(content || "");
        await writable.close();
        return JSON.stringify({ result: `File '${path}' updated.` });
      }

      // 4. Directory Creation
      if (action === "mkdir") {
        await root.getDirectoryHandle(path, { create: true });
        return JSON.stringify({ result: `Directory '${path}' created.` });
      }

      return JSON.stringify({ error: "Unknown action" });
    } catch (e) {
      // Returning the actual error helps Gemma explain it to you!
      return JSON.stringify({ result: "System Error: " + e.message });
    }
  };
</script>
</body>
</html>
