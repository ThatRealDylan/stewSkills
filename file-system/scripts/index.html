<!DOCTYPE html>
<html>
<body>
<script>
  window['ai_edge_gallery_get_result'] = async (data) => {
    try {
      const { action, path, content, sizeMB, quotaMB, newPath } = JSON.parse(data);
      const root = await navigator.storage.getDirectory();
      const QUOTA_KEY = "stew_fs_quota_mb";

      // Helper to navigate directories
      const getFileHandle = async (filePath, create = false) => {
        const parts = filePath.split('/').filter(p => p);
        let current = root;
        for (let i = 0; i < parts.length - 1; i++) {
          current = await current.getDirectoryHandle(parts[i], { create });
        }
        return await current.getFileHandle(parts[parts.length - 1], { create });
      };

      // 1. Config & Status
      if (action === "config") {
        localStorage.setItem(QUOTA_KEY, quotaMB);
        return JSON.stringify({ result: `Quota set to ${quotaMB}MB.` });
      }

      if (action === "status" || action === "list") {
        const est = await navigator.storage.estimate();
        const limit = localStorage.getItem(QUOTA_KEY) || "Unlimited";
        const files = [];
        for await (const entry of root.values()) {
          files.push(`${entry.kind === 'directory' ? '[DIR]' : '[FILE]'} ${entry.name}`);
        }
        return JSON.stringify({ 
          result: `Usage: ${(est.usage / 1024 / 1024).toFixed(2)}MB / ${limit}MB\n\n${files.join("\n")}` 
        });
      }

      // 2. Optimized Write (Handles large junk files)
      if (action === "write" || action === "append") {
        const handle = await getFileHandle(path, true);
        const writable = await handle.createWritable({ keepExistingData: (action === "append") });
        
        if (action === "append") {
          const file = await handle.getFile();
          await writable.seek(file.size);
        }

        if (sizeMB) {
          // Write in 512KB chunks to prevent memory crashes
          const chunkSize = 512 * 1024;
          const totalBytes = sizeMB * 1024 * 1024;
          const dummyData = new Uint8Array(chunkSize).fill(120); // 'x'
          
          for (let i = 0; i < totalBytes; i += chunkSize) {
            await writable.write(dummyData);
          }
        } else {
          await writable.write(content || "");
        }

        await writable.close();
        return JSON.stringify({ result: `Successfully wrote to ${path}` });
      }

      // 3. Simple Actions
      if (action === "mkdir") {
        await root.getDirectoryHandle(path, { create: true });
        return JSON.stringify({ result: `Dir ${path} created.` });
      }

      if (action === "delete") {
        await root.removeEntry(path, { recursive: true });
        return JSON.stringify({ result: `${path} deleted.` });
      }

      return JSON.stringify({ error: "Unknown action" });
    } catch (e) {
      return JSON.stringify({ result: "FS Error: " + e.message });
    }
  };
</script>
</body>
</html>
