<!DOCTYPE html>
<html>
<body>
<script>
  window['ai_edge_gallery_get_result'] = async (data) => {
    try {
      const { action, filename, content } = JSON.parse(data);
      const root = await navigator.storage.getDirectory();

      if (action === "write") {
        const fileHandle = await root.getFileHandle(filename, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(content);
        await writable.close();
        return JSON.stringify({ result: `Successfully wrote to ${filename}.` });
      }

      if (action === "read") {
        const fileHandle = await root.getFileHandle(filename);
        const file = await fileHandle.getFile();
        const text = await file.text();
        return JSON.stringify({ result: `Content of ${filename}:\n\n${text}` });
      }

      if (action === "list") {
        const files = [];
        for await (const entry of root.values()) {
          files.push(entry.name);
        }
        return JSON.stringify({ result: files.length ? `Files: ${files.join(", ")}` : "No files found." });
      }

      if (action === "delete") {
        await root.removeEntry(filename);
        return JSON.stringify({ result: `${filename} deleted.` });
      }

    } catch (e) {
      return JSON.stringify({ error: "File System Error: " + e.message });
    }
  };
</script>
</body>
</html>
