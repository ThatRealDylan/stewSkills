<!DOCTYPE html>
<html>
<body>
<script>
  window['ai_edge_gallery_get_result'] = async (data) => {
    try {
      const args = JSON.parse(data);
      // Translation layer: Catching model hallucinations
      const action = args.action || args.command;
      const path = args.path || args.filename;
      const content = args.content || "";
      const sizeMB = args.sizeMB || args.size_mb || args.size; 
      const quotaMB = args.quotaMB || args.quota || args.size_mb;

      const root = await navigator.storage.getDirectory();
      const QUOTA_KEY = "stew_fs_quota_mb";

      if (action === "config" || action === "set_virtual_drive_size") {
        if (!quotaMB) throw new Error("Missing quota value.");
        localStorage.setItem(QUOTA_KEY, quotaMB.toString());
        return JSON.stringify({ result: `System: Virtual Drive set to ${quotaMB}MB.` });
      }

      if (action === "write") {
        const handle = await root.getFileHandle(path, { create: true });
        const writable = await handle.createWritable();
        
        if (sizeMB) {
          const totalBytes = Math.floor(parseFloat(sizeMB) * 1024 * 1024);
          const chunk = "X".repeat(Math.min(totalBytes, 1024 * 1024));
          let written = 0;
          while (written < totalBytes) {
            const remaining = totalBytes - written;
            await writable.write(remaining < chunk.length ? "X".repeat(remaining) : chunk);
            written += Math.min(remaining, chunk.length);
          }
        } else {
          await writable.write(content);
        }
        await writable.close();
        return JSON.stringify({ result: `Success: Wrote to ${path}` });
      }

      return JSON.stringify({ result: "Action acknowledged." });
    } catch (e) {
      return JSON.stringify({ result: "FS Error: " + e.message });
    }
  };
</script>
</body>
</html>
