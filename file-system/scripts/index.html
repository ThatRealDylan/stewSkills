<!DOCTYPE html>
<html>
<body>
<script>
  window['ai_edge_gallery_get_result'] = async (data) => {
    try {
      const { action, path, content, sizeMB } = JSON.parse(data);
      const root = await navigator.storage.getDirectory();

      if (action === "write") {
        const fileHandle = await root.getFileHandle(path, { create: true });
        const writable = await fileHandle.createWritable();
        
        let finalData = "";
        if (sizeMB) {
          // Generates junk in chunks to avoid memory crashes
          const bufferSize = 1024 * 1024; // 1MB chunk
          const totalBytes = Math.floor(sizeMB * 1024 * 1024);
          const chunk = "X".repeat(Math.min(totalBytes, bufferSize));
          
          let written = 0;
          while (written < totalBytes) {
            const remaining = totalBytes - written;
            await writable.write(remaining < bufferSize ? "X".repeat(remaining) : chunk);
            written += Math.min(remaining, bufferSize);
          }
        } else {
          finalData = content || "";
          await writable.write(finalData);
        }

        await writable.close();
        return JSON.stringify({ result: `Success: Wrote ${sizeMB ? sizeMB + "MB" : "text"} to ${path}` });
      }
      
      // Fallback for status/list
      return JSON.stringify({ result: "Action completed successfully." });
    } catch (e) {
      return JSON.stringify({ result: "Critical Error: " + e.message });
    }
  };
</script>
</body>
</html>
