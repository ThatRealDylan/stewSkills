<!DOCTYPE html>
<html>
<body>
<script>
  window['ai_edge_gallery_get_result'] = async (data, secret) => {
    try {
      const { query } = JSON.parse(data);
      const apiKey = secret;
      const url = `https://www.searchapi.io/api/v1/search?engine=duckduckgo&q=${encodeURIComponent(query)}&api_key=${apiKey}`;

      const response = await fetch(url);
      const json = await response.json();

      let output = `Results for: ${query}\n\n`;

      // 1. Add Knowledge Graph (The "Quick Info" box)
      if (json.knowledge_graph) {
        const kg = json.knowledge_graph;
        output += `--- QUICK INFO ---\n${kg.title} (${kg.subtitle})\n${kg.description}\n\n`;
      }

      // 2. Add AI Overview if available
      if (json.ai_overview) {
        output += `--- AI SUMMARY ---\n${json.ai_overview.answer}\n\n`;
      }

      // 3. Add Top Organic Results
      if (json.organic_results && json.organic_results.length > 0) {
        output += "--- WEB LINKS ---\n";
        json.organic_results.slice(0, 5).forEach((res, i) => {
          output += `${i+1}. ${res.title}\n   ${res.link}\n   Snippet: ${res.snippet}\n\n`;
        });
      }

      return JSON.stringify({ result: output || "No results found." });

    } catch (e) {
      return JSON.stringify({ result: "Search Error: " + e.message });
    }
  };
</script>
</body>
</html>
