<!DOCTYPE html>
<html>
<body>
<script>
  window['ai_edge_gallery_get_result'] = async (data) => {
    try {
      const { query } = JSON.parse(data);
      // Using DDG's official API for clean data
      const ddgApi = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
      
      const response = await fetch(ddgApi);
      const json = await response.json();

      let output = "";

      // 1. Check for a direct answer
      if (json.AbstractText) {
        output += `Main Result: ${json.AbstractText}\nSource: ${json.AbstractURL}\n\n`;
      }

      // 2. Add related links (The actual "Web Search" part)
      if (json.RelatedTopics && json.RelatedTopics.length > 0) {
        output += "Related Search Results:\n";
        json.RelatedTopics.slice(0, 5).forEach((topic, i) => {
          if (topic.Text && topic.FirstURL) {
            output += `${i+1}. ${topic.Text} - ${topic.FirstURL}\n`;
          }
        });
      }

      if (!output) output = "No direct results found. Try a broader search term.";

      return JSON.stringify({ result: output });
    } catch (e) {
      // Returning the error as a result so Gemma can tell you what's up
      return JSON.stringify({ result: "Web Search Error: " + e.message });
    }
  };
</script>
</body>
</html>
